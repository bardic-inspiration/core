# CI — the merge gate. docs/ci.md says what it must do, and why.
#
# The gate is one command, `npm run check` (AGENTS.md "Commands"), that you,
# agents, and CI all run: types, every ruleset, map, and scenario, the recorded
# matches, and the tests. A Markdown-only diff skips setup and check, but the
# job still runs and reports green, so `gate` can be a required status check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch, force-push, or manual run) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only diff — skipping setup and check (docs/ci.md)."
          fi

      - name: Set up Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      # The check plays matches in a Web Worker in headless Chromium
      # (tests/browser.test.ts). The browser is cached per Playwright version;
      # its system libraries are installed every run.
      - name: Find the Playwright version
        if: steps.changes.outputs.docs_only != 'true'
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        if: steps.changes.outputs.docs_only != 'true'
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.changes.outputs.docs_only != 'true' && steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.changes.outputs.docs_only != 'true' && steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check
