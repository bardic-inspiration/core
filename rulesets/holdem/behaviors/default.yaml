# How the hold 'em AI seats play. Scores read `strength`, a derived value the
# ruleset keeps for them, through the seat's own view of the table.
format: 2
behaviorSet: { id: default }
ruleset: { id: holdem, version: 0.2.0 }

behaviors:
  shark:
    doc: Tight and aggressive. Calls when the price is right for the hand, and bets strong hands in proportion to the pot.
    scores:
      fold: 10
      check: 20
      call: >-
        cel.bind(cost, min(player.chips, game.bet - player.staked), cel.bind(pot, all.player.map(p, p.committed).sum(),
          player.strength * (pot + cost) >= 110 * cost ? 30 : 0))
      raise: >-
        player.strength < 60 ? 0
          : cel.bind(want, game.bet + floorDiv(all.player.map(p, p.committed).sum() * player.strength, 100),
              50 - floorDiv(abs(to - want) * 10, max(1, want)))

  station:
    doc: A calling station. Never folds, and raises only with a monster.
    scores:
      fold: 0
      check: 20
      call: 30
      raise: "player.strength >= 90 ? 40 : 0"

  maniac:
    doc: Loose and aggressive. Raises the minimum with almost anything, and shoves a big hand.
    scores:
      fold: "player.strength < 30 && (game.bet - player.staked) * 2 > all.player.map(p, p.committed).sum() ? 25 : 0"
      check: 5
      call: 20
      raise: >-
        player.strength >= 80 && to == player.staked + player.chips ? 60
          : player.strength >= 35 && to == game.bet + game.minRaise ? 30
          : 0
