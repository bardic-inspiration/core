# An open game has no winner. The scenario only says when to stop and what to count.
end:
  - when: "game.tick > 80"
    outcome:
      result: "'census'"
      machines: "all.machine.size()"
      awake: "all.machine.filter(m, m.awake).size()"
      built: "all.machine.filter(m, m.born > 0).size()"
      parts: "all.part.size()"
      rust: "all.machine.filter(m, m.awake && m.seat == 'rust').size()"
      moss: "all.machine.filter(m, m.awake && m.seat == 'moss').size()"
      chrome: "all.machine.filter(m, m.awake && m.seat == 'chrome').size()"
      scavenger: "all.machine.filter(m, m.awake && m.seat == 'scavenger').size()"
      wild: "all.machine.filter(m, m.awake && m.seat == 'wild').size()"

limits: { maxDecisions: 20000 }
