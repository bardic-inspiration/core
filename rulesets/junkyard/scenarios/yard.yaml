# A yard strewn with scrap, where more keeps falling. Three makes of robot
# start with one machine each: rust hoards, moss builds, and chrome fights.
# A scavenger starts with one small machine among them. Two derelicts stand
# where they were left, a part or two short of waking.
#
# Every seat is left to its machines' own brains. A player may take any of
# them, and the scavenger's is the one meant for it. Nobody wins: after 80
# ticks the scenario takes a census. A yardmaster seat can author new scrap
# while the match runs.
format: 2
scenario: { id: yard, title: The yard }
ruleset: { id: junkyard, version: 0.3.0 }

seats:
  rust: { behavior: wired }
  moss: { behavior: wired }
  chrome: { behavior: wired }
  scavenger: { behavior: wired }
  wild: { behavior: wired }
  yardmaster: { referee: true }

map: scrapyard

game: { dropEvery: 4 }

entities:
  - { id: rust-1, kind: machine, fields: { seat: rust, pos: [1, 1], gauge: 2 } }
  - { id: moss-1, kind: machine, fields: { seat: moss, pos: [1, 10], gauge: 2 } }
  - { id: chrome-1, kind: machine, fields: { seat: chrome, pos: [14, 6], gauge: 2 } }
  - { id: pip, kind: machine, fields: { seat: scavenger, pos: [8, 11], gauge: 2 } }
  # Derelicts. A sentry with no brain, and a hulk with no eye, no brain, and a seized striker.
  - { id: sentry, kind: machine, fields: { seat: wild, pos: [13, 4] } }
  - { id: hulk, kind: machine, fields: { seat: wild, pos: [8, 8], gauge: 3 } }

  # What each starts with.
  - { id: r-eye, kind: part, fields: { flow: signal, role: sensor } }
  - { id: r-brain, kind: part, fields: { flow: signal, role: gate, drives: { hoard: 3, build: 1, fight: 0 } } }
  - { id: r-legs, kind: part, fields: { flow: motion, role: source, rate: 2 } }
